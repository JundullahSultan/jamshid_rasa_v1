<!doctype html><html lang="fa-AF" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>استاد جمشید رسا | سیستم سمینارها</title><script src="https://cdn.tailwindcss.com"></script><script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script><link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"><style>
:root{--navy:#0f172a;--gold:#d97706}*{box-sizing:border-box}body{font-family:Vazirmatn,sans-serif;background:#f6f7f9;color:var(--navy);margin:0}button,input,select{font:inherit}button{cursor:pointer}button:disabled{opacity:.5;cursor:default}header{background:var(--navy);color:white;padding:24px 4vw}nav{display:flex;gap:8px;padding:18px 4vw;background:white;border-bottom:1px solid #e2e8f0;flex-wrap:wrap}nav button{padding:12px 20px;border-radius:10px;color:#64748b}nav button.active{background:#0f172a;color:white}main{max-width:1440px;margin:auto;padding:36px 4vw}.card{background:white;border:1px solid #e2e8f0;border-radius:16px;padding:24px}.title{font-size:26px;font-weight:800;margin-bottom:8px}.muted{color:#64748b;font-size:13px}.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;background:#d97706;color:white;border-radius:9px;padding:11px 17px;font-size:13px;font-weight:600}.btn.secondary{background:#f1f5f9;color:#334155}.btn.green{background:#059669}.btn.red{background:#fef2f2;color:#dc2626}.badge{display:inline-block;padding:5px 10px;border-radius:7px;font-size:11px;background:#fff7ed;color:#b45309}.badge.ok{background:#ecfdf5;color:#047857}.badge.no{background:#fef2f2;color:#b91c1c}table{width:100%;border-collapse:collapse;text-align:right;font-size:12px}th{background:#f8fafc;color:#64748b;font-weight:500;padding:15px 12px;white-space:nowrap}td{padding:20px 12px;border-bottom:1px solid #f1f5f9;vertical-align:middle}td small{display:block;color:#64748b;margin-top:5px}label{display:block;font-size:13px;font-weight:600}input,select{width:100%;padding:11px 12px;margin-top:7px;border:1px solid #cbd5e1;border-radius:9px;background:white;min-width:0}input:focus,select:focus{outline:2px solid #fbbf24;outline-offset:2px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:20px}.strip{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin:24px 0}.count{font-size:34px;font-weight:800;margin:10px 0}.tablewrap{overflow:auto}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:24px 0}.pill{padding:9px 15px;border:1px solid #e2e8f0;border-radius:25px;background:white;font-size:12px}.pill.selected{background:#fff7ed;border-color:#d97706;color:#b45309}i svg,svg.lucide{width:18px;height:18px}.intro{display:flex;justify-content:space-between;gap:16px;align-items:center;margin-bottom:26px}.notice{background:#fffbeb;border:1px solid #fde68a;padding:11px 18px;color:#92400e;font-size:12px;border-radius:10px;margin-bottom:24px}dialog{border:0;border-radius:18px;padding:28px;max-width:540px;width:90%;box-shadow:0 30px 100px #0003}dialog::backdrop{background:#0f172a88}#toast{position:fixed;bottom:24px;left:24px;background:#0f172a;color:white;border-radius:12px;padding:16px 24px;z-index:50;display:none}.spinner{width:28px;height:28px;border:3px solid #e2e8f0;border-top-color:#d97706;border-radius:50%;animation:spin .8s linear infinite;margin:auto}@keyframes spin{to{transform:rotate(360deg)}}.episode{display:flex;gap:12px;align-items:center;padding:16px 0;border-bottom:1px solid #f1f5f9}.episode .tools{margin-inline-start:auto;display:flex;gap:8px}.tools button{padding:6px;background:#f8fafc;border-radius:6px}#qr img,#qr canvas{margin:auto}.credit{direction:ltr;background:linear-gradient(120deg,#0f172a,#334155);color:white;border-radius:16px;padding:24px;margin-bottom:20px;max-width:380px}.drop{border:2px dashed #cbd5e1;border-radius:12px;text-align:center;padding:34px 15px;background:#f8fafc;cursor:pointer}.drop.over{border-color:#d97706;background:#fffbeb}.progress{height:8px;background:#e2e8f0;border-radius:9px;overflow:hidden;margin-top:16px}.progress div{height:100%;background:#d97706;width:0;transition:width .15s}.ticket{border:2px dashed #d97706;text-align:center;background:#fffdf7;padding:30px;border-radius:18px}.public-banner{background:#0f172a;color:white;border-radius:18px;padding:32px;margin-bottom:24px}.hidden{display:none!important}@media(max-width:900px){.grid2,.strip{grid-template-columns:1fr}main{padding:24px 16px}.title{font-size:22px}nav{padding:12px}nav button{padding:10px}.card{padding:18px}}@media print{header,nav,.notice,.noprint{display:none!important}body{background:white}main{padding:0}.card,.ticket{break-inside:avoid}}
</style></head><body><header><div class="flex justify-between items-center gap-4"><div class="flex items-center gap-3"><div class="p-3 rounded-xl bg-white/10"><i data-lucide="book-open"></i></div><div class="text-xl font-bold">استاد جمشید رسا<div class="text-xs text-slate-400 font-normal mt-1">پلتفرم رسمی آموزش، سمینار و ارتباط با شاگردان</div></div></div><span class="badge ok">نسخهٔ نمایشی تعاملی</span></div></header><nav id="nav"></nav><main><div class="notice">محیط نمایشی — پرداخت، ارسال تکت و آپلود ویدیو شبیه‌سازی می‌شود. اطلاعات بانکی واقعی وارد نکنید.</div><div id="view"></div></main><dialog id="modal"><div id="modalbody"></div><button class="btn secondary mt-5" onclick="document.getElementById('modal').close()">بستن</button></dialog><div id="toast" role="status"></div>
<script>
const $=s=>document.querySelector(s),fa=n=>Number(n).toLocaleString('fa-AF'),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),icon=n=>`<i data-lucide="${n}"></i>`;
const seminar='سمینار بزرگ قدرت ذهن و غلبه بر اضطراب — کابل';
let queue=[{id:1,name:'احمد فرید احمدی',father:'محمد ظاهر',phone:'93700123456',email:'ahmad@example.com',location:'کابل',tier:'VIP',method:'hesab',status:'pending',ref:'HP-294815',paid:'۱٬۰۰۰ افغانی'},{id:2,name:'مریم سادات',father:'عبدالرحمان',phone:'491511234567',email:'maryam@example.com',location:'آلمان',tier:'عادی',method:'visa',status:'pending',ref:'V-84152',paid:'$25'},{id:3,name:'بلال هروی',father:'عبدالکریم',phone:'93790123456',email:'bilal@example.com',location:'هرات',tier:'عادی',method:'hesab',status:'pending',ref:'HP-294820',paid:'۵۰۰ افغانی'},{id:4,name:'سارا نوری',father:'محمد ناصر',phone:'12025550183',email:'sara@example.com',location:'امریکا',tier:'VIP',method:'visa',status:'approved',ref:'V-84167',paid:'$25'},{id:5,name:'حمیدالله صافی',father:'گل احمد',phone:'93780123456',email:'hamid@example.com',location:'مزار شریف',tier:'عادی',method:'hesab',status:'approved',ref:'HP-294832',paid:'۵۰۰ افغانی'}];
let students=queue.filter(x=>x.status==='approved').map(x=>({...x,courses:2}));let addedDomestic=0,addedInternational=0,tab=0,filter='all',search='',payment='hesab',uploading=false,progress=0,uploadTimer,selectedSeries=0,lastTicket=null,processing=false;
let series=[{name:'سلسله درس‌های عزت‌نفس و خودباوری',episodes:[{title:'جلسه اول: شناخت ارزش‌های فردی',duration:'۲۴',locked:false},{title:'جلسه دوم: ساختن اعتماد به نفس',duration:'۳۸',locked:true}]},{name:'سمینار کامل مدیریت خشم',episodes:[{title:'جلسه اول: شناخت خشم',duration:'۴۵',locked:true}]},{name:'دوره تخصصی آرامش درون',episodes:[{title:'جلسه اول: تمرین حضور ذهن',duration:'۳۰',locked:true}]}];
const locations=['کابل','هرات','مزار شریف','قندهار','ننگرهار','بامیان','آلمان','اروپا','امریکا','کانادا','آسترالیا'];const domestic=x=>locations.slice(0,6).includes(x);const labels=['لیست انتظار سمینار','بانک اطلاعاتی شاگردان','مدیریت ویدیو و سلسله‌ها','ثبت‌نام و ریزرف چوکی'];
function refreshIcons(){window.lucide?.createIcons()}function toast(s){$('#toast').textContent=s;$('#toast').style.display='block';clearTimeout(toast.timer);toast.timer=setTimeout(()=>$('#toast').style.display='none',3500)}function modal(html){$('#modalbody').innerHTML=html;$('#modal').showModal();refreshIcons()}function header(title,sub){return `<div class="intro"><div><h1 class="title">${title}</h1><p class="muted">${sub}</p></div><span class="badge">${icon('shield-check')} مدیریت رسمی</span></div>`}
function render(){ $('#nav').innerHTML=labels.map((s,i)=>`<button class="${tab===i?'active':''}" onclick="switchTab(${i})">${fa(i+1)}. ${s}</button>`).join('');$('#view').innerHTML=[waiting,directory,uploader,booking][tab]();refreshIcons() }
function switchTab(n){tab=n;render()}
function waiting(){const rows=queue.filter(x=>filter==='all'||x.status===filter);return header('لیست انتظار و تایید ثبت‌نام',seminar)+`<div class="card mb-5 flex justify-between items-center"><div><span class="muted">مجموع شاگردان ثبت‌شده</span><div class="text-2xl font-extrabold mt-2">${fa(1482+addedDomestic+addedInternational)} نفر</div></div><div><span class="badge">${fa(queue.filter(x=>x.status==='pending').length)} درخواست در انتظار</span></div></div><div class="toolbar"><div class="flex gap-2 flex-wrap">${[['all','همه'],['pending','در انتظار تایید'],['approved','تایید شده']].map(([v,l])=>`<button class="pill ${filter===v?'selected':''}" onclick="filter='${v}';render()">${l}</button>`).join('')}</div><span class="muted">${fa(rows.length)} درخواست</span></div><div class="card tablewrap !p-0"><table><thead><tr>${['نام و نام پدر','واتساپ و محل سکونت','سمینار و نوعیت چوکی','روش پرداخت و رسید','وضعیت','اقدامات'].map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${rows.map(x=>`<tr><td><b>${esc(x.name)}</b><small>فرزند ${esc(x.father)}</small></td><td><span dir="ltr">+${esc(x.phone)}</span><small>${esc(x.location)}</small></td><td>قدرت ذهن و غلبه بر اضطراب<small>چوکی ${esc(x.tier)}</small></td><td><span class="badge ${x.method==='visa'?'ok':''}">${x.method==='visa'?'Visa / Mastercard':'حساب‌پی (HesabPay)'}</span>${x.method==='visa'?`<small dir="ltr">Paid — ${esc(x.paid)}</small>`:`<button class="block text-amber-700 text-xs mt-2 underline" onclick="proof(${x.id})">مشاهده رسید / کد پیگیری</button>`}</td><td><span class="badge ${x.status==='approved'?'ok':x.status==='rejected'?'no':''}">${x.status==='approved'?'تایید شده':x.status==='rejected'?'رد شده':'در انتظار تایید'}</span></td><td>${x.status==='pending'?`<div class="flex gap-2 flex-wrap"><button class="btn green" onclick="approve(${x.id})">${icon('qr-code')} تایید و ارسال تکت QR</button><button class="btn red" onclick="reject(${x.id})">رد</button></div>`:`<button class="btn secondary" onclick="showTicket(${x.id})">مشاهده ثبت‌نام</button>`}</td></tr>`).join('')||'<tr><td colspan="6" class="text-center">درخواستی یافت نشد.</td></tr>'}</tbody></table></div>`}
function proof(id){const x=queue.find(x=>x.id===id);modal(`<h2 class="title">رسید پرداخت حساب‌پی</h2><div class="card mt-4"><p>${esc(x.name)}</p><p class="muted mt-2">مبلغ: ${esc(x.paid)}</p><p class="mt-4" dir="ltr">${esc(x.ref)}</p><p class="badge ok mt-4">رسید نمایشی برای بررسی مدیر</p></div>`)}function approve(id){const x=queue.find(x=>x.id===id);if(x.status!=='pending')return;x.status='approved';students.unshift({...x,courses:1});domestic(x.location)?addedDomestic++:addedInternational++;render();toast('ثبت‌نام تایید شد؛ تکت نمایشی آمادهٔ دریافت است.');showTicket(id)}function reject(id){modal(`<h2 class="title">رد درخواست ثبت‌نام؟</h2><p class="muted">این درخواست از لیست انتظار خارج می‌شود.</p><button class="btn red mt-5" onclick="queue.find(x=>x.id===${id}).status='rejected';document.getElementById('modal').close();render();toast('درخواست رد شد')">تایید رد درخواست</button>`)}
function directory(){return header('بانک اطلاعاتی و آمار شاگردان','اطلاعات تماس شاگردان، در اختیار کامل شماست.')+`<div class="strip">${[['مجموع شاگردان ثبت‌شده',1482+addedDomestic+addedInternational,'users'],['شاگردان داخل افغانستان',940+addedDomestic,'map-pin'],['شاگردان خارج از کشور / مهاجرین',542+addedInternational,'globe']].map(([s,n,i])=>`<div class="card">${icon(i)}<div class="count">${fa(n)} <span class="text-sm font-normal text-slate-400">نفر</span></div><p class="muted">${s}</p></div>`).join('')}</div><div class="toolbar"><input aria-label="جستجوی شاگردان" style="max-width:400px" placeholder="جستجو با نام، واتساپ، ایمیل یا ولایت…" value="${esc(search)}" oninput="search=this.value;drawDirectory()"><div class="flex gap-2"><button class="btn secondary" onclick="exportStudents()">${icon('download')} خروجی برای Excel</button><button class="btn" onclick="broadcast()">${icon('message-circle')} لیست پیام واتساپ</button></div></div><p class="muted mb-4">شمارنده‌ها شامل آرشیف نمونه است؛ جدول، رکوردهای نمایشی و ثبت‌نام‌های تاییدشدهٔ همین جلسه را نشان می‌دهد.</p><div class="card tablewrap !p-0"><table><thead><tr>${['نام شاگرد','واتساپ','ایمیل','ولایت / کشور','سمینارهای خریداری‌شده','مجموع پرداخت'].map(s=>`<th>${s}</th>`).join('')}</tr></thead><tbody id="directoryRows">${directoryRows()}</tbody></table></div>`}
function filteredStudents(){return students.filter(x=>[x.name,x.phone,x.email,x.location].some(v=>v.toLowerCase().includes(search.toLowerCase())))}function directoryRows(){return filteredStudents().map(x=>`<tr><td><b>${esc(x.name)}</b></td><td dir="ltr">+${esc(x.phone)}</td><td dir="ltr">${esc(x.email)}</td><td>${esc(x.location)}</td><td>${fa(x.courses)}</td><td>${esc(x.paid)}</td></tr>`).join('')||'<tr><td colspan="6" class="text-center">شاگردی یافت نشد.</td></tr>'}function drawDirectory(){$('#directoryRows').innerHTML=directoryRows()}function download(name,text,type){const a=document.createElement('a');const url=URL.createObjectURL(new Blob([text],{type}));a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}function exportStudents(){const cell=s=>'"'+String(s).replace(/^[=+@\-]/,"'").replaceAll('"','""')+'"';download('students.csv','\uFEFF'+[['نام','واتساپ','ایمیل','ولایت / کشور','تعداد سمینار','مجموع پرداخت'],...filteredStudents().map(x=>[x.name,x.phone,x.email,x.location,x.courses,x.paid])].map(r=>r.map(cell).join(',')).join('\r\n'),'text/csv;charset=utf-8');toast('فایل سازگار با Excel آماده شد')}function broadcast(){modal(`<h2 class="title">لیست تماس واتساپ</h2><p class="muted">${fa(filteredStudents().length)} مخاطب؛ هیچ پیامی خودکار ارسال نمی‌شود.</p><textarea id="contacts" class="w-full border rounded-lg p-3 mt-4" rows="6" dir="ltr" readonly>${filteredStudents().map(x=>'+'+x.phone).join('\n')}</textarea><button class="btn mt-3" onclick="copyContacts()">کاپی شماره‌ها</button>`)}async function copyContacts(){try{await navigator.clipboard.writeText($('#contacts').value);toast('شماره‌ها کاپی شد')}catch{$('#contacts').select();toast('شماره‌ها را کاپی کنید')}}
function uploader(){return header('آپلود ویدیو و مدیریت سلسله سمینارها','محتوای آموزشی را منظم بسازید و دسترسی شاگردان را مدیریت کنید.')+`<div class="toolbar"><label class="flex-1 max-w-xl">انتخاب سلسله سمینارها<select onchange="selectedSeries=Number(this.value);render()">${series.map((s,i)=>`<option value="${i}" ${i===selectedSeries?'selected':''}>${esc(s.name)}</option>`).join('')}</select></label><button class="btn secondary" onclick="newSeries()">${icon('plus')} ایجاد سلسلهٔ جدید</button></div><div class="grid2"><form class="card" id="uploadform" onsubmit="startUpload(event)"><h2 class="font-bold text-lg mb-5">افزودن بخش جدید</h2><label>عنوان بخش یا جلسه<input id="episodeTitle" required placeholder="جلسه سوم: ریشه‌های ترس و اهمال‌کاری" ${uploading?'disabled':''}></label><div class="grid2 mt-4"><label>مدت ویدیو (دقیقه)<input id="duration" type="number" min="1" max="600" required value="۳۰" placeholder="۳۰"></label><label>نوعیت دسترسی<select id="access"><option value="locked">مخصوص خریداران دوره</option><option value="free">رایگان پیش‌نمایش</option></select></label></div><label class="flex gap-3 items-start p-4 bg-emerald-50 rounded-xl my-5"><input id="watermark" type="checkbox" checked role="switch" class="!w-5 accent-emerald-600"><span>فعال‌سازی واترمارک هوشمند<small class="block font-normal text-xs text-emerald-800 mt-2">نمایش شماره موبایل شاگرد روی ویدیو جهت جلوگیری از نشر در تلگرام</small></span></label><div id="drop" class="drop" role="button" tabindex="0" onclick="document.getElementById('videofile').click()" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();document.getElementById('videofile').click()}" ondragover="event.preventDefault();this.classList.add('over')" ondragleave="this.classList.remove('over')" ondrop="pickDrop(event)">${icon('cloud-upload')}<p class="font-semibold mt-3">ویدیو را اینجا رها کنید یا کلیک کنید</p><p class="muted mt-2" id="filename">انتخاب فایل ویدیو — آپلود نمایشی</p><input type="file" accept="video/*" id="videofile" class="hidden" onchange="pickFile(this.files[0])"></div><div class="progress"><div id="progressbar" style="width:${progress}%"></div></div><p id="progresslabel" class="muted mt-2">${fa(progress)}٪</p><button class="btn w-full mt-4" id="uploadbutton" ${uploading?'disabled':''}>${uploading?'در حال آپلود…':'آپلود نمایشی و افزودن به سلسله'}</button></form><div class="card"><h2 class="font-bold text-lg">بخش‌های سلسلهٔ انتخاب‌شده</h2><p class="muted mt-2">${esc(series[selectedSeries].name)}</p><div class="mt-5">${series[selectedSeries].episodes.map((x,i)=>`<div class="episode"><span class="badge">${fa(i+1)}</span><div><b class="text-sm">${esc(x.title)}</b><p class="muted mt-1">${esc(x.duration)} دقیقه · ${x.locked?'مخصوص خریداران':'پیش‌نمایش رایگان'}${x.watermark?' · واترمارک فعال':''}</p></div><div class="tools"><button title="ویرایش" aria-label="ویرایش" onclick="editEpisode(${i})">${icon('pencil')}</button><button title="انتقال به بالا" aria-label="انتقال به بالا" ${i===0?'disabled':''} onclick="moveEpisode(${i})">${icon('arrow-up')}</button><button title="تغییر دسترسی" aria-label="تغییر دسترسی" onclick="series[selectedSeries].episodes[${i}].locked=!series[selectedSeries].episodes[${i}].locked;render()">${icon(x.locked?'lock':'unlock')}</button></div></div>`).join('')||'<p class="muted">هنوز بخشی اضافه نشده است.</p>'}</div></div></div>`}
let chosenFile=null;function pickFile(file){if(!file)return;if(!file.type.startsWith('video/'))return toast('لطفاً یک فایل ویدیو انتخاب کنید.');chosenFile=file;$('#filename').textContent=file.name+' — '+(file.size/1048576).toFixed(1)+' MB'}function pickDrop(e){e.preventDefault();e.currentTarget.classList.remove('over');pickFile(e.dataTransfer.files[0])}function newSeries(){modal(`<h2 class="title">ایجاد سلسلهٔ جدید</h2><form onsubmit="event.preventDefault();series.push({name:this.elements.name.value.trim(),episodes:[]});selectedSeries=series.length-1;document.getElementById('modal').close();render()"><label>نام سلسله<input name="name" required pattern=".*\\S.*"></label><button class="btn mt-4">ایجاد سلسله</button></form>`)}function editEpisode(i){const x=series[selectedSeries].episodes[i];modal(`<h2 class="title">ویرایش عنوان بخش</h2><form onsubmit="event.preventDefault();series[selectedSeries].episodes[${i}].title=this.elements.title.value.trim();document.getElementById('modal').close();render()"><input name="title" required value="${esc(x.title)}"><button class="btn mt-4">ذخیره</button></form>`)}function moveEpisode(i){const a=series[selectedSeries].episodes;[a[i-1],a[i]]=[a[i],a[i-1]];render()}function startUpload(e){e.preventDefault();if(uploading)return;if(!chosenFile)return toast('نخست یک فایل ویدیو انتخاب کنید.');const target=selectedSeries,ep={title:$('#episodeTitle').value.trim(),duration:$('#duration').value,locked:$('#access').value==='locked',watermark:$('#watermark').checked};uploading=true;progress=0;$('#uploadbutton').disabled=true;uploadTimer=setInterval(()=>{progress=Math.min(100,progress+10);if(tab===2){$('#progressbar').style.width=progress+'%';$('#progresslabel').textContent=fa(progress)+'٪'}if(progress===100){clearInterval(uploadTimer);series[target].episodes.push(ep);uploading=false;chosenFile=null;if(tab===2)render();toast('آپلود نمایشی تکمیل و بخش به سلسله اضافه شد.')}},180)}
function booking(){return `<div class="public-banner"><span class="badge">ثبت‌نام سمینار حضوری</span><h1 class="title mt-4">${seminar}</h1><p class="text-slate-300 text-sm">یک قدم به آرامش و توانمندی نزدیک‌تر شوید. تکت شما پس از ثبت‌نام آماده می‌شود.</p><div class="flex flex-wrap gap-5 mt-5 text-sm text-amber-300"><span>کابل · تالار سمینار</span><span>ظرفیت محدود</span><span>دریافت تکت دیجیتال</span></div></div>${lastTicket?`<div class="card mb-5 flex justify-between items-center"><span class="text-emerald-700">آخرین ثبت‌نام: ${esc(lastTicket.name)}</span><button class="btn secondary" onclick="showTicket(${lastTicket.id})">مشاهده تکت</button></div>`:''}<form id="bookingform" onsubmit="pay(event)"><div class="grid2"><div class="card"><h2 class="font-bold text-lg mb-5">۱. معلومات شاگرد</h2><div class="grid2"><label>نام مکمل<input name="name" required autocomplete="name" placeholder="احمد فرید احمدی"></label><label>نام پدر<input name="father" required placeholder="محمد ظاهر"></label><label>شماره واتساپ فعال<input name="phone" type="tel" dir="ltr" required pattern="[+0-9 ()-]{8,20}" placeholder="+93 700 123 456"></label><label>ایمیل آدرس<input name="email" type="email" dir="ltr" required placeholder="name@example.com"></label><label>محل سکونت<select name="location">${locations.map(s=>`<option>${s}</option>`).join('')}</select></label><label>انتخاب نوعیت تکت<select name="tier" onchange="updatePrice()"><option value="عادی">چوکی عادی — ۵۰۰ افغانی</option><option value="VIP">چوکی VIP — ۱٬۰۰۰ افغانی / ۲۰ دالر</option></select></label></div><p class="muted mt-5">تکت QR در این نسخه برای نمایش و دریافت آماده می‌شود؛ پیام واتساپ ارسال نمی‌شود.</p></div><div class="card"><h2 class="font-bold text-lg mb-5">۲. انتخاب روش پرداخت</h2><div class="flex gap-2 mb-5"><button type="button" id="hesabtab" class="pill selected" onclick="paymentTab('hesab')">حساب‌پی (HesabPay)</button><button type="button" id="visatab" class="pill" onclick="paymentTab('visa')">Visa / Mastercard</button></div><div id="hesabpanel"><div class="bg-slate-50 border rounded-xl p-5 text-center"><p class="font-bold">استاد جمشید رسا · حساب نمایشی</p><p class="muted mt-2" dir="ltr">HesabPay ID: 93700XXXXXX</p><div id="merchantqr" class="mt-4 flex justify-center"></div></div><label class="mt-4">شماره حساب‌پی / کد پیگیری نمایشی<input name="reference" placeholder="HP-123456"></label><label class="mt-3">یا بارگذاری رسید بانکی<input name="receipt" type="file" accept="image/*,.pdf"></label></div><div id="visapanel" class="hidden"><div class="credit"><div class="flex justify-between text-sm"><b>VISA</b><span>Mastercard</span></div><div class="text-xl tracking-widest my-6">4532 •••• •••• 8891</div><span class="text-xs">DEMO CARD · 12/28</span></div><p class="muted mb-3">فقط از معلومات آزمایشی زیر استفاده کنید.</p><label>نام دارندهٔ کارت<input value="AHMAD AHMADI" readonly dir="ltr"></label><label class="mt-3">شماره کارت آزمایشی<input value="4532 0000 0000 8891" readonly dir="ltr"></label><div class="grid2 mt-3"><label>تاریخ انقضا<input value="12/28" readonly dir="ltr"></label><label>CVV آزمایشی<input value="123" readonly dir="ltr"></label></div></div><div id="paymentstatus" class="mt-5" role="status" aria-live="polite"></div><button id="paybutton" class="btn w-full mt-5">پرداخت از طریق حساب‌پی — ۵۰۰ افغانی</button><p class="muted text-center mt-3">${icon('lock-keyhole')} شبیه‌ساز پرداخت؛ هیچ مبلغی کسر نمی‌شود.</p></div></div></form>`}
function paymentTab(p){payment=p;$('#hesabpanel').classList.toggle('hidden',p!=='hesab');$('#visapanel').classList.toggle('hidden',p!=='visa');$('#hesabtab').classList.toggle('selected',p==='hesab');$('#visatab').classList.toggle('selected',p==='visa');updatePrice()}function updatePrice(){const vip=$('#bookingform').elements.tier.value==='VIP';$('#paybutton').textContent=payment==='visa'?'پرداخت امن ۲۰ دالر (Visa/Mastercard)':`پرداخت از طریق حساب‌پی — ${vip?'۱٬۰۰۰':'۵۰۰'} افغانی`}
async function pay(e){e.preventDefault();if(processing)return;const form=e.target,data=new FormData(form);if(!String(data.get('name')).trim()||!String(data.get('father')).trim())return toast('نام و نام پدر را کامل وارد کنید.');if(payment==='hesab'&&!String(data.get('reference')).trim()&&!form.elements.receipt.files.length)return toast('کد پیگیری را وارد کنید یا رسید را بارگذاری نمایید.');processing=true;const method=payment;const x={id:Date.now(),name:String(data.get('name')).trim(),father:String(data.get('father')).trim(),phone:String(data.get('phone')).replace(/\D/g,''),email:String(data.get('email')),location:String(data.get('location')),tier:String(data.get('tier')),method,status:'pending',ref:method==='hesab'?String(data.get('reference')||'HP-'+Date.now()):'V-'+Date.now(),paid:method==='visa'?'$20':data.get('tier')==='VIP'?'۱٬۰۰۰ افغانی':'۵۰۰ افغانی'};$('#paybutton').disabled=true;$('#paymentstatus').innerHTML=`<div class="spinner"></div><p class="muted text-center mt-3">${method==='hesab'?'در حال ارتباط نمایشی با سیستم حساب‌پی و بررسی تراکنش…':'در حال تایید نمایشی کارت بانکی بین‌المللی…'}</p>`;await new Promise(r=>setTimeout(r,2000));queue.unshift(x);lastTicket=x;processing=false;if(tab===3){render();paymentTab('hesab');merchantQR()}toast('پرداخت نمایشی موفق؛ ثبت‌نام در لیست انتظار مدیر اضافه شد.');showTicket(x.id)}
function ticketHTML(x){return `<div class="ticket"><span class="badge ok">${x.status==='approved'?'ثبت‌نام تایید شده':'پرداخت نمایشی موفق · منتظر تایید مدیر'}</span><h2 class="text-xl font-extrabold mt-5">تکت دیجیتال سمینار</h2><p class="muted mt-2">قدرت ذهن و غلبه بر اضطراب — کابل</p><h3 class="text-2xl font-bold mt-5">${esc(x.name)}</h3><p class="muted mt-2">چوکی ${esc(x.tier)} · ${esc(x.location)}</p><div id="qr" class="my-6"></div><p class="text-xs" dir="ltr">JR-${x.id}</p><p class="muted mt-3">نمونهٔ نمایشی — برای ورود واقعی اعتبار ندارد.</p></div><div class="flex gap-2 mt-5 noprint"><button class="btn" onclick="saveTicket(${x.id})">${icon('download')} دریافت تکت</button><button class="btn secondary" onclick="document.getElementById('modal').close();switchTab(0)">مشاهده لیست انتظار</button></div>`}function qrInto(el,text,size){if(window.QRCode){new QRCode(el,{text,width:size,height:size,colorDark:'#0f172a',colorLight:'#ffffff',correctLevel:QRCode.CorrectLevel.M})}else{el.textContent=text;el.classList.add('p-4','border');}}function showTicket(id){const x=queue.find(x=>x.id===id);modal(ticketHTML(x));qrInto($('#qr'),'JR-DEMO:'+x.id+':'+x.status,170)}function saveTicket(id){const x=queue.find(x=>x.id===id);const img=$('#qr img')?.src||$('#qr canvas')?.toDataURL();download('JR-ticket-'+id+'.html',`<!doctype html><html lang="fa-AF" dir="rtl"><meta charset="utf-8"><title>تکت نمایشی</title><body style="font-family:Arial;text-align:center;padding:50px"><h1>تکت دیجیتال سمینار</h1><h2>${esc(x.name)}</h2><p>قدرت ذهن و غلبه بر اضطراب — کابل</p><p>چوکی ${esc(x.tier)}</p>${img?`<img src="${img}" width="170" height="170">`:''}<p>JR-${id}</p><p>نمونهٔ نمایشی؛ برای ورود واقعی اعتبار ندارد.</p></body></html>`,'text/html;charset=utf-8')}function merchantQR(){if($('#merchantqr'))qrInto($('#merchantqr'),'DEMO-HESABPAY-MERCHANT-NOT-A-REAL-PAYMENT',110)}
const originalRender=render;render=function(){originalRender();if(tab===2){$('#duration').value='30';if(uploading)$('#uploadbutton').disabled=true}if(tab===3){payment='hesab';merchantQR();if(processing){$('#paybutton').disabled=true;$('#paymentstatus').innerHTML='<div class="spinner"></div><p class="muted text-center mt-3">پرداخت نمایشی در حال بررسی است…</p>'}}};render();
</script></body></html>
